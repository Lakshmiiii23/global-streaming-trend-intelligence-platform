name: Global Streaming Trend Intelligence Pipeline

on:
  push:
    branches:
      - main
  schedule:
    # Trigger automatically every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Ingestion Source (hybrid, live, or synthetic)'
        required: true
        default: 'hybrid'
        type: choice
        options:
          - hybrid
          - live
          - synthetic
      days:
        description: 'Number of historical days (if synthetic)'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Ingest, Process & Load Streaming Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m camoufox fetch

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Run End-to-End Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_BACKEND: ${{ secrets.STORAGE_BACKEND }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ENVIRONMENT: 'production'
          LOG_LEVEL: 'INFO'
          INPUT_SOURCE: ${{ github.event.inputs.source }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
        run: |
          SOURCE="${INPUT_SOURCE:-hybrid}"
          DAYS="${INPUT_DAYS:-7}"
          echo "Executing pipeline with SOURCE=$SOURCE and DAYS=$DAYS"
          xvfb-run python run_pipeline.py --mode=all --source="$SOURCE" --days="$DAYS"

      - name: Commit and Push Updated Intelligence Database
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/streaming_intelligence.db data/bronze/
          git diff --staged --quiet || (git commit -m "chore: automated daily streaming intelligence data refresh [skip ci]" && git push origin main)

      - name: Upload Ingestion Artifacts (if local storage)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-run-data
          path: |
            data/bronze/
            data/streaming_intelligence.db
          retention-days: 7
